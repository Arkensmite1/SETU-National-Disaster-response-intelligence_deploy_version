services:
  - type: web
    name: setu-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: setu
      - key: JWT_SECRET
        generateValue: true
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-large-latest
      - key: MISTRAL_VISION_MODEL
        value: pixtral-12b-latest
      - key: CORS_ORIGINS
        sync: false
